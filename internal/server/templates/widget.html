<!doctype html>
<html lang="{{.Language}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{.Title}}</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    body { position: relative; font-family: system-ui, sans-serif; }
    .widget-link { display: block; width: 100%; height: 100%; color: inherit; text-decoration: none; outline: none; }
    .widget-link:focus-visible { box-shadow: inset 0 0 0 2px #d96e51; }
    svg { display: block; width: 100%; height: 100%; }
    .visitortrace-map-viewport { cursor: grab; touch-action: none; }
    body.is-panning .visitortrace-map-viewport { cursor: grabbing; }
    .visitortrace-marker { cursor: pointer; outline: none; }
    .visitortrace-marker circle { transform-box: fill-box; transform-origin: center; transition: filter 120ms ease, fill-opacity 120ms ease, stroke-width 120ms ease, transform 120ms ease; }
    .visitortrace-marker:hover circle, .visitortrace-marker:focus circle { filter: drop-shadow(0 1px 2px rgba(18, 28, 30, .45)); fill-opacity: 1; stroke-width: 1.4; transform: scale(1.18); }
    .widget-tooltip { position: fixed; z-index: 4; max-width: min(240px, calc(100vw - 16px)); padding: 8px 10px; color: #fff; background: #172123; border: 1px solid rgba(255, 255, 255, .14); border-radius: 4px; box-shadow: 0 5px 18px rgba(18, 28, 30, .22); pointer-events: none; }
    .widget-tooltip[hidden] { display: none; }
    .widget-tooltip strong { display: block; overflow: hidden; font-size: 12px; line-height: 1.35; text-overflow: ellipsis; white-space: nowrap; }
    .widget-tooltip p { display: flex; gap: 10px; margin: 3px 0 0; color: #e6eceb; font-size: 11px; line-height: 1.35; white-space: nowrap; }
    .widget-tooltip small { display: block; margin-top: 4px; color: #aebcba; font-size: 9px; line-height: 1.3; }
    .map-controls { position: fixed; z-index: 3; display: flex; gap: 4px; }
    .map-control { display: grid; width: 25px; height: 25px; place-items: center; padding: 0; border: 1px solid rgba(91, 110, 108, .45); border-radius: 3px; background: rgba(255, 255, 255, .94); color: #34484a; box-shadow: 0 1px 5px rgba(18, 28, 30, .14); cursor: pointer; }
    .map-control:hover, .map-control:focus-visible { border-color: #2f655a; background: #f3f8f6; color: #214e45; outline: none; }
    .map-control:focus-visible { box-shadow: 0 0 0 2px rgba(47, 101, 90, .25); }
    .map-control svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 2; }
    @media (prefers-reduced-motion: reduce) { .visitortrace-marker circle { transition: none; } }
  </style>
</head>
<body>
  <a id="widget-link" class="widget-link" href="{{.AnalyticsURL}}" target="_blank" rel="noopener" aria-label="{{.Title}}" data-attribution="{{.Attribution}}" data-pv-label="{{.PageviewsLabel}}" data-uv-label="{{.VisitorsLabel}}" data-width="{{.Width}}" data-height="{{.Height}}">
    {{.SVG}}
  </a>
  <div id="widget-tooltip" class="widget-tooltip" role="status" aria-live="polite" hidden>
    <strong></strong>
    <p><span data-value="pv"></span><span data-value="uv"></span></p>
    <small></small>
  </div>
  <div id="widget-map-controls" class="map-controls" role="toolbar" aria-label="{{.ControlsLabel}}"></div>
  <script>
    (function () {
      "use strict";
      var root = document.getElementById("widget-link");
      var tooltip = document.getElementById("widget-tooltip");
      var title = tooltip.querySelector("strong");
      var pv = tooltip.querySelector('[data-value="pv"]');
      var uv = tooltip.querySelector('[data-value="uv"]');
      var attribution = tooltip.querySelector("small");
      var svg = root.querySelector("svg");
      var viewport = root.querySelector(".visitortrace-map-viewport");
      var mapContent = root.querySelector(".visitortrace-map-content");
      var controlsHost = document.getElementById("widget-map-controls");
      var active = null;
      var touchArmed = null;
      var suppressClick = false;
      var pointers = {};
      var gesture = null;
      var gestureMoved = false;
      var view = { scale: 1, x: 0, y: 0 };
      var viewFrame = 0;

      Array.prototype.forEach.call(root.querySelectorAll(".visitortrace-marker > title"), function (node) {
        node.remove();
      });

      if (window.parent !== window) {
        window.parent.postMessage({
          type: "visitortrace:resize",
          width: Number(root.dataset.width),
          height: Number(root.dataset.height)
        }, "*");
      }

      function clamp(value, minimum, maximum) {
        return Math.min(maximum, Math.max(minimum, value));
      }

      function constrainView() {
        var width = Number(viewport.dataset.width) || 1;
        var height = Number(viewport.dataset.height) || 1;
        view.x = clamp(view.x, width * (1 - view.scale), 0);
        view.y = clamp(view.y, height * (1 - view.scale), 0);
      }

      function renderView() {
        viewFrame = 0;
        mapContent.setAttribute("transform", "translate(" + view.x + " " + view.y + ") scale(" + view.scale + ")");
      }

      function applyView(immediate) {
        constrainView();
        if (immediate) {
          if (viewFrame) window.cancelAnimationFrame(viewFrame);
          renderView();
        } else if (!viewFrame) {
          viewFrame = window.requestAnimationFrame(renderView);
        }
      }

      function resetView() {
        view = { scale: 1, x: 0, y: 0 };
        applyView(true);
        hide();
      }

      function viewportPoint(clientX, clientY) {
        var point = svg.createSVGPoint();
        point.x = clientX;
        point.y = clientY;
        var matrix = viewport.getScreenCTM();
        return matrix ? point.matrixTransform(matrix.inverse()) : { x: 0, y: 0 };
      }

      function pointerValues() {
        return Object.keys(pointers).map(function (key) { return pointers[key]; });
      }

      function capturePointer(event) {
        if (!viewport.setPointerCapture) return false;
        try {
          viewport.setPointerCapture(event.pointerId);
          return true;
        } catch (_) {
          return false;
        }
      }

      function beginGesture() {
        var values = pointerValues();
        if (!values.length) {
          gesture = null;
          return;
        }
        if (values.length === 1) {
          var point = viewportPoint(values[0].x, values[0].y);
          gesture = { type: "pan", point: point, clientX: values[0].x, clientY: values[0].y, x: view.x, y: view.y };
          return;
        }
        var centerX = (values[0].x + values[1].x) / 2;
        var centerY = (values[0].y + values[1].y) / 2;
        var center = viewportPoint(centerX, centerY);
        gesture = {
          type: "pinch",
          distance: Math.hypot(values[0].x - values[1].x, values[0].y - values[1].y) || 1,
          scale: view.scale,
          contentX: (center.x - view.x) / view.scale,
          contentY: (center.y - view.y) / view.scale
        };
      }

      function placeControls() {
        if (!viewport || !controlsHost.children.length) return;
        var matrix = viewport.getScreenCTM();
        if (!matrix) return;
        var width = Number(viewport.dataset.width) || 1;
        var height = Number(viewport.dataset.height) || 1;
        var topLeft = svg.createSVGPoint();
        var bottomRight = svg.createSVGPoint();
        topLeft.x = 0;
        topLeft.y = 0;
        bottomRight.x = width;
        bottomRight.y = height;
        topLeft = topLeft.matrixTransform(matrix);
        bottomRight = bottomRight.matrixTransform(matrix);
        controlsHost.style.left = Math.round(Math.min(topLeft.x, bottomRight.x) + 7) + "px";
        controlsHost.style.top = Math.round(Math.max(topLeft.y, bottomRight.y) - controlsHost.offsetHeight - 7) + "px";
      }

      function createLocateIcon() {
        var icon = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        icon.setAttribute("viewBox", "0 0 24 24");
        icon.setAttribute("aria-hidden", "true");
        var ticks = document.createElementNS("http://www.w3.org/2000/svg", "path");
        ticks.setAttribute("d", "M2 12h3m14 0h3M12 2v3m0 14v3");
        icon.appendChild(ticks);
        [7, 3].forEach(function (radius) {
          var circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
          circle.setAttribute("cx", "12");
          circle.setAttribute("cy", "12");
          circle.setAttribute("r", radius);
          icon.appendChild(circle);
        });
        return icon;
      }

      var mapControls = {
        add: function (definition) {
          if (!definition || !definition.id || typeof definition.activate !== "function") return null;
          mapControls.remove(definition.id);
          var button = document.createElement("button");
          button.type = "button";
          button.className = "map-control";
          button.dataset.controlId = definition.id;
          button.title = definition.label || definition.id;
          button.setAttribute("aria-label", definition.label || definition.id);
          if (typeof definition.icon === "function") button.appendChild(definition.icon());
          button.addEventListener("click", function (event) {
            event.preventDefault();
            event.stopPropagation();
            definition.activate({ root: root, controls: mapControls, reset: resetView });
          });
          controlsHost.appendChild(button);
          placeControls();
          return button;
        },
        remove: function (id) {
          var button = Array.prototype.find.call(controlsHost.children, function (candidate) {
            return candidate.dataset.controlId === String(id);
          });
          if (button) button.remove();
        }
      };
      window.VisitorTraceMapControls = mapControls;
      mapControls.add({ id: "reset", label: {{printf "%q" .ResetLabel}}, icon: createLocateIcon, activate: resetView });
      root.dispatchEvent(new CustomEvent("visitortrace:map-controls-ready", { bubbles: true, detail: { controls: mapControls, reset: resetView } }));
      window.addEventListener("resize", placeControls, { passive: true });

      viewport.addEventListener("wheel", function (event) {
        event.preventDefault();
        var point = viewportPoint(event.clientX, event.clientY);
        var nextScale = clamp(view.scale * Math.exp(-event.deltaY * 0.0015), 1, 8);
        var ratio = nextScale / view.scale;
        view.x = point.x - (point.x - view.x) * ratio;
        view.y = point.y - (point.y - view.y) * ratio;
        view.scale = nextScale;
        applyView();
        hide();
      }, { passive: false });

      viewport.addEventListener("pointerdown", function (event) {
        if (event.pointerType === "mouse" && event.button !== 0) return;
        var deferCapture = Boolean(markerFrom(event.target)) && event.pointerType !== "mouse";
        pointers[event.pointerId] = { x: event.clientX, y: event.clientY, startX: event.clientX, startY: event.clientY, captured: false, deferCapture: deferCapture };
        if (!deferCapture) pointers[event.pointerId].captured = capturePointer(event);
        if (pointerValues().length === 1) {
          gestureMoved = false;
          suppressClick = false;
        }
        beginGesture();
        document.body.classList.add("is-panning");
      });

      viewport.addEventListener("pointermove", function (event) {
        var pointer = pointers[event.pointerId];
        if (!pointer) return;
        if (pointer.deferCapture) {
          if (Math.hypot(event.clientX - pointer.startX, event.clientY - pointer.startY) <= 3) return;
          pointer.deferCapture = false;
          pointer.captured = capturePointer(event);
        }
        pointer.x = event.clientX;
        pointer.y = event.clientY;
        var values = pointerValues();
        if (values.length > 1) {
          if (!gesture || gesture.type !== "pinch") beginGesture();
          var distance = Math.hypot(values[0].x - values[1].x, values[0].y - values[1].y) || 1;
          var center = viewportPoint((values[0].x + values[1].x) / 2, (values[0].y + values[1].y) / 2);
          view.scale = clamp(gesture.scale * distance / gesture.distance, 1, 8);
          view.x = center.x - gesture.contentX * view.scale;
          view.y = center.y - gesture.contentY * view.scale;
          gestureMoved = true;
        } else if (gesture && gesture.type === "pan") {
          var point = viewportPoint(event.clientX, event.clientY);
          view.x = gesture.x + point.x - gesture.point.x;
          view.y = gesture.y + point.y - gesture.point.y;
          if (Math.hypot(event.clientX - gesture.clientX, event.clientY - gesture.clientY) > 3) gestureMoved = true;
        }
        applyView();
        hide();
        event.preventDefault();
      });

      function endPointer(event, captureLost) {
        var pointer = pointers[event.pointerId];
        if (!pointer) return;
        delete pointers[event.pointerId];
        if (!captureLost && pointer.captured && viewport.releasePointerCapture && viewport.hasPointerCapture && viewport.hasPointerCapture(event.pointerId)) viewport.releasePointerCapture(event.pointerId);
        if (pointerValues().length) {
          beginGesture();
        } else {
          gesture = null;
          document.body.classList.remove("is-panning");
          if (gestureMoved) suppressClick = true;
        }
      }
      viewport.addEventListener("pointerup", endPointer);
      viewport.addEventListener("pointercancel", endPointer);
      viewport.addEventListener("lostpointercapture", function (event) { endPointer(event, true); });
      window.addEventListener("blur", function () {
        pointers = {};
        gesture = null;
        gestureMoved = false;
        document.body.classList.remove("is-panning");
      });

      function markerFrom(target) {
        return target && target.closest ? target.closest(".visitortrace-marker") : null;
      }

      function place(marker, event) {
        var circle = marker.querySelector("circle");
        var box = circle ? circle.getBoundingClientRect() : marker.getBoundingClientRect();
        var x = event && typeof event.clientX === "number" ? event.clientX : box.left + box.width / 2;
        var y = event && typeof event.clientY === "number" ? event.clientY : box.top + box.height / 2;
        var margin = 8;
        var left = Math.min(Math.max(margin, x + 12), window.innerWidth - tooltip.offsetWidth - margin);
        var top = y + 12;
        if (top + tooltip.offsetHeight > window.innerHeight - margin) top = y - tooltip.offsetHeight - 12;
        tooltip.style.left = Math.max(margin, left) + "px";
        tooltip.style.top = Math.max(margin, top) + "px";
      }

      function show(marker, event) {
        if (!marker) return;
        active = marker;
        title.textContent = marker.dataset.city || marker.dataset.country || "Unknown";
        pv.textContent = root.dataset.pvLabel + ": " + (marker.dataset.pv || "0");
        uv.textContent = root.dataset.uvLabel + ": " + (marker.dataset.uv || "0");
        attribution.textContent = root.dataset.attribution;
        tooltip.hidden = false;
        place(marker, event);
      }

      function hide(marker) {
        if (marker && active !== marker) return;
        active = null;
        tooltip.hidden = true;
      }

      root.addEventListener("pointerover", function (event) { show(markerFrom(event.target), event); });
      root.addEventListener("pointermove", function (event) {
        var marker = markerFrom(event.target);
        if (marker) show(marker, event);
      });
      root.addEventListener("pointerout", function (event) {
        var marker = markerFrom(event.target);
        if (marker && markerFrom(event.relatedTarget) !== marker) hide(marker);
      });
      root.addEventListener("focusin", function (event) { show(markerFrom(event.target)); });
      root.addEventListener("focusout", function (event) {
        var marker = markerFrom(event.target);
        if (marker && markerFrom(event.relatedTarget) !== marker) hide(marker);
      });
      root.addEventListener("click", function (event) {
        if (suppressClick) {
          event.preventDefault();
          suppressClick = false;
          return;
        }
        var marker = markerFrom(event.target);
        if (!marker || !window.matchMedia || !window.matchMedia("(hover: none)").matches) return;
        if (touchArmed !== marker) {
          event.preventDefault();
          touchArmed = marker;
          show(marker, event);
        } else {
          touchArmed = null;
        }
      });
      root.addEventListener("keydown", function (event) {
        var marker = markerFrom(event.target);
        if (!marker) return;
        if (event.key === "Escape") hide(marker);
        if (event.key === "Enter") {
          event.preventDefault();
          root.click();
        }
        if (event.key === " ") {
          event.preventDefault();
          show(marker);
        }
      });
    }());
  </script>
</body>
</html>
